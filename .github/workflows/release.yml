name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest
            macarch: aarch64
          - os: macos-13
            macarch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          # Optional: updater artifact signing. Leave unset to skip .sig generation.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Tag macOS updater artifact with arch
        if: runner.os == 'macOS'
        run: |
          find src-tauri/target/release/bundle -name '*.app.tar.gz' | while read -r f; do
            base="${f%.tar.gz}"
            mv "$f" "${base}.${{ matrix.macarch }}.tar.gz"
            [ -f "$f.sig" ] && mv "$f.sig" "${base}.${{ matrix.macarch }}.tar.gz.sig"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true

      - name: Collect installer files
        run: |
          mkdir -p release-files
          find dist -type f \( \
            -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.tar.gz' -o -name '*.sig' -o -name 'latest.json' \
          \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Generate latest.json for updater
        run: python3 scripts/generate-latest-json.py release-files
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: release-files/*
